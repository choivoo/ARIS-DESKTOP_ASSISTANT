name: Build DuoMorph Home APK

on:
  push:
    branches:
      - build/duomorph-home-1.0-20260920
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: duomorph-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../DuoMorphHome-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoMorphHome-1.0.0-APK
          path: DuoMorphHome-1.0.0.apk
          if-no-files-found: error
